name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Test
        run: uv run --no-sync pytest -q

      - name: Smoke-test the JSON-RPC server
        run: |
          uv run --no-sync python -m forthic.jsonrpc.server --port 18999 &
          SERVER_PID=$!
          for _ in $(seq 1 50); do
            curl -s -o /dev/null -X POST 127.0.0.1:18999/rpc \
              -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":0,"method":"listModules","params":{}}' && break
            sleep 0.2
          done
          RESULT=$(curl -s -X POST 127.0.0.1:18999/rpc \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"executeWord","params":{"word_name":"+","stack":[{"int_value":40},{"int_value":2}]}}')
          kill $SERVER_PID
          echo "$RESULT" | grep -q '"int_value": 42' || { echo "smoke failed: $RESULT"; exit 1; }
          echo "smoke OK: $RESULT"

  lint:
    name: ruff & mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: ruff
        run: uv run --no-sync ruff check .

      - name: mypy
        run: uv run --no-sync mypy forthic
